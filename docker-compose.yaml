services:
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9094

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 20s

  transactions-api:
    build:
      context: .
      dockerfile: TransactionsAPI/Dockerfile
    container_name: transactions-api
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      Kafka__BootstrapServers: "kafka:9092"
      Kafka__Topic: "account-events"
      ASPNETCORE_URLS: "http://+:5087"
    ports:
      - "5087:5087"
    restart: unless-stopped

  projection:
    build:
      context: .
      dockerfile: ProjectionService/Dockerfile
    container_name: projection
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: "kafka:9092"
      KAFKA_TOPIC: "account-events"
      # interpolables para que scripts/replay.sh pueda levantar un grupo nuevo
      # desde el offset 0 sin tocar el compose
      KAFKA_GROUP: "${KAFKA_GROUP:-balance-projection-group}"
      KAFKA_START_OFFSET: "${KAFKA_START_OFFSET:-first}"
      HTTP_ADDR: ":8090"
      DB_PATH: "/data/data.db?_pragma=journal_mode(WAL)&_pragma=busy_timeout(5000)"
    ports:
      - "8090:8090"
    volumes:
      - ./data:/data
    restart: unless-stopped

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"

      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
